## Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin code style for this project: "official" or "obsolete" (formatting only).
kotlin.code.style=official
# AndroidX is required (no support-library artifacts anywhere in this project).
android.useAndroidX=true
# Disable build features that this MVP does not use, to keep build times down.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
